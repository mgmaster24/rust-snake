[package]
name = "snake"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "snake"
path = "src/main.rs"

# Native deps — not compiled for WASM
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.28.1"
rand = "0.9.0"

# WASM deps
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
